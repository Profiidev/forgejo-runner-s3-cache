name: Publish Test Results
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

jobs:
  publish:
    name: Publish test results
    runs-on: ubuntu-latest
    # Never check out or run code from the PR here, this job has a write token
    if: github.event.workflow_run.conclusion != 'skipped'
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event-file/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/test-results*/**/*.xml
