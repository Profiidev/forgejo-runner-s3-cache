name: Tests
on:
  pull_request:

jobs:
  backend_test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy,rustfmt

      - name: Cache cargo and rust files
        id: rust_cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: "backend_test_cache"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest
      - name: "Backend Test"
        run: cd backend && cargo nextest run --nff

      - name: Upload Test Result File
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results-backend
          path: ${{ github.workspace }}/target/nextest/default/junit-backend.xml
          retention-days: 5
