name: Publish Lint Results
on:
  workflow_run:
    workflows: [Checks and Validation]
    types: [completed]

jobs:
  publish:
    name: Publish lint results
    runs-on: ubuntu-latest
    # Only fork PRs upload results, PRs from this repo create their check runs directly.
    # Never check out or run code from the PR here, this job has a write token
    if: github.event.workflow_run.head_repository.full_name != github.repository
    permissions:
      actions: read
      checks: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lint-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish lint results
        uses: profiidev/rust-lint-action@16801b02ca2bc0441e458d7f713d8a0e8d417927 # v4
        with:
          publish_results: lint-results.json
          github_token: ${{ steps.app-token.outputs.token }}
