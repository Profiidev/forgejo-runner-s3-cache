name: Release Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "v0.0.0"

jobs:
  update-version:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - name: Update version
        id: update_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW_TAG=$INPUT_VERSION
          NEW_VERSION="${RAW_TAG#v}"
          echo "Bumping version to $NEW_VERSION"
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" backend/Cargo.toml
          cargo metadata -q > /dev/null

      - name: Create PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Updated version to ${{ github.event.inputs.version }}"
          branch: chore/release-version-${{ github.event.inputs.version }}
          title: "Release version ${{ github.event.inputs.version }}"
          body: "This PR releases the version ${{ github.event.inputs.version }}."
          base: main
          sign-commits: true
          labels: release-version
