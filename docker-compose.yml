services:
  backend:
    image: ghcr.io/profiidev/images/rust-musl-watch:main@sha256:b03ecb064002e849d0f65dfa3690053241b0bfe4b893926f527d70655ff8bedc
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    volumes:
      - ./backend:/app
    networks:
      - nginx
    tty: true
    ports:
      - "5173:8000"
    entrypoint: ["tini", "--"]
    command: ["cargo", "watch", "-x", "run"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    volumes:
      - ./postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=test
    networks:
      - nginx
    ports:
      - "9301:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  docker-in-docker:
    image: docker:dind@sha256:3ef33f2e220b79ed3ef3b99d81746f06f306cd6340e2cb7331d17ae996e74cb6
    container_name: "docker_dind"
    privileged: "true"
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    restart: "unless-stopped"
    networks:
      - nginx

  gitea:
    image: "data.forgejo.org/forgejo/runner:12.10.2@sha256:379b324d6942824b7487706c0a06be4d63e546c17b62bece4ae18c74364a8fae"
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_started
      backend:
        condition: service_started
    container_name: "runner"
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    volumes:
      - ./data:/data
    restart: "unless-stopped"
    networks:
      - nginx
    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config /data/config.yaml"'

networks:
  nginx:
