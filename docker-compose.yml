services:
  backend:
    image: ghcr.io/profiidev/images/rust-musl-watch:main@sha256:75520ac615ecee80262bde9954e9c440db9be2d9aecd3769158b43e664c765d0
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    volumes:
      - ./backend:/app
    networks:
      - nginx
    tty: true
    ports:
      - "5173:8000"
    entrypoint: ["tini", "--"]
    command: ["cargo", "watch", "-x", "run"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    volumes:
      - ./postgres:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=test
    networks:
      - nginx
    ports:
      - "9301:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "test"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

  docker-in-docker:
    image: docker:dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
    container_name: "docker_dind"
    privileged: "true"
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    restart: "unless-stopped"
    networks:
      - nginx

  gitea:
    image: "data.forgejo.org/forgejo/runner:13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d"
    links:
      - docker-in-docker
    depends_on:
      docker-in-docker:
        condition: service_started
      backend:
        condition: service_started
    container_name: "runner"
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    volumes:
      - ./data:/data
    restart: "unless-stopped"
    networks:
      - nginx
    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config /data/config.yaml"'

networks:
  nginx:
